name: Build Linux Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dpkg-dev \
            libfuse2 \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        run: npx tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb

      - name: Verify Linux packages
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          bundle_dir="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          appimages=("$bundle_dir"/appimage/*.AppImage)
          debs=("$bundle_dir"/deb/*.deb)

          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          if [[ ! -s "${appimages[0]}" ]]; then
            echo "AppImage is empty: ${appimages[0]}" >&2
            exit 1
          fi

          if [[ ${#debs[@]} -ne 1 ]]; then
            echo "Expected exactly one Debian package, found ${#debs[@]}." >&2
            exit 1
          fi
          if [[ ! -s "${debs[0]}" ]]; then
            echo "Debian package is empty: ${debs[0]}" >&2
            exit 1
          fi

          dpkg-deb --info "${debs[0]}"
          file "${appimages[0]}"

          printf 'appimage=%s\n' "${appimages[0]}" >> "$GITHUB_OUTPUT"
          printf 'deb=%s\n' "${debs[0]}" >> "$GITHUB_OUTPUT"

      - name: Install headless GUI test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb

      - name: Smoke test AppImage launch
        shell: bash
        run: |
          set -uo pipefail

          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT

          set +e
          timeout --signal=TERM --kill-after=5s 20s \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            bash -euo pipefail -c '
              appimage="$1"
              log_file="$2"

              setsid "$appimage" >"$log_file" 2>&1 &
              app_pid=$!

              cleanup_app() {
                kill -- "-$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup_app EXIT

              sleep 5
              process_state="$(ps -o stat= -p "$app_pid" 2>/dev/null || true)"
              if [[ -z "$process_state" || "$process_state" == Z* ]]; then
                if wait "$app_pid"; then
                  exit_code=0
                else
                  exit_code=$?
                fi
                echo "AppImage exited before the 5-second startup check (exit code: $exit_code)." >&2
                exit 1
              fi
            ' _ "${{ steps.verify.outputs.appimage }}" "$log_file"
          smoke_status=$?
          set -e

          if [[ -s "$log_file" ]]; then
            echo "AppImage stdout/stderr:"
            cat "$log_file"
          fi
          if [[ "$smoke_status" -ne 0 ]]; then
            echo "AppImage headless launch smoke test failed (exit code: $smoke_status)." >&2
            exit "$smoke_status"
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClearCalc-Linux-x64-AppImage
          path: ${{ steps.verify.outputs.appimage }}
          if-no-files-found: error

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ClearCalc-Linux-x64-DEB
          path: ${{ steps.verify.outputs.deb }}
          if-no-files-found: error
