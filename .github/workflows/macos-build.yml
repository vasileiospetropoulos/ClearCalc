name: Build macOS DMGs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.architecture }} DMG
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            target: aarch64-apple-darwin
            artifact: ClearCalc-macOS-Apple-Silicon
          - architecture: Intel
            target: x86_64-apple-darwin
            artifact: ClearCalc-macOS-Intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust and target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx tauri build --target "${{ matrix.target }}" --bundles dmg
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
